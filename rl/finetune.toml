# Stage 2 of the boss's training (ADR-012): stage 1's policy beats rush but not turtle, so
# this continues it against a league weighted towards turtle and scout.
# `python -m arena_rl.train finetune.toml runs/stage2`, after stage 1 has run into runs/stage1.
[train]
seed = 2
init = "runs/stage1/checkpoints/00150.npz"  # stage 1's last checkpoint (config.toml)
updates = 300
games_per_update = 72
jobs = 9
hidden = 64
lr = 3e-4
gamma = 0.99   # per decision, i.e. every boss.DECIDE_EVERY turns
lam = 0.95
clip = 0.2
value_coef = 0.5
entropy_coef = 0.01
epochs = 4
minibatch = 512
max_grad_norm = 0.5

[league]
# Relative weights for the scripted opponents: most games against the ones stage 1 struggles with.
scripted = { rush = 0.2, scout = 0.25, turtle = 0.45, greedy = 0.05, random = 0.05 }
scripted_share = 0.5  # of games against a scripted bot
past_share = 0.3      # against a past checkpoint; the rest against the current policy
snapshot_every = 10   # updates between checkpoints added to the league

[eval]
every = 10        # updates between evaluations against the fixed baselines
seed_pairs = 20   # seeds 0..19, each from both seats
