# Server parameters. Paths come from the environment (ARENA_DATA_DIR), not from here.

[queue]
# A running match whose lease expires is voided and re-queued. Longer than the slowest
# possible match (400 turns at the 2 s backstop, plus setup), so a live worker is never
# reaped and needs no heartbeat.
lease_s = 1200
reap_every_s = 60
idle_sleep_s = 1.0

[validation]
smoke_turns = 50           # turns of the smoke match against builtin:random
error_max_bytes = 4096     # what the owner sees of a rejection

[ratings]
# OpenSkill Weng-Lin (ADR-003). A version's code never changes, so neither does its skill:
# no drift term (tau = 0), and uncertainty only ever shrinks.
mu = 25.0
sigma = 8.333333333333334
beta = 3.0                 # per-game noise; OpenSkill's default 4.17 was underconfident here (docs/ratings_validation.md)
tau = 0.0
conservative_k = 3.0       # leaderboard rank: mu - k * sigma
provisional_sigma = 3.0    # above this, a bot is shown as provisional

[matchmaking]
explore_floor = 0.02       # even a lopsided pairing keeps this much weight; at 0.1, 44% of games were near-certain
pair_cap = 4               # at most this many games between two bots ...
pair_window = 200          # ... among the most recent this many matches
placement_seed_pairs = 2   # per anchor; each seed is played from both seats
placement_priority = 10
queue_target = 8           # the scheduler keeps this many matches queued

[api]
upload_max_bytes = 2000000      # one bot file
uploads_per_day = 20            # per user
comparisons_per_day = 10        # per user
compare_max_seed_pairs = 20
viewers_per_match = 50
viewers_total = 200
session_max_age_s = 2592000     # 30 days
live_poll_s = 0.1               # how often a viewer's socket checks for new turns
live_wait_s = 600               # how long a viewer waits for a queued match to start
