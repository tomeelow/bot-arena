name: deploy

# After `verify` passes on main: the server first, then the site, so the API a new page calls
# is already there. Off until the repository variable DEPLOY is "on" (deploy/RUNBOOK.md).
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the commit on the VM
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          printf '%s\n' "$KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "deploy@$HOST" "$SHA"

  web:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Publish to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.168.0 pages deploy build --project-name "${{ vars.PAGES_PROJECT }}" --branch main --commit-hash "${{ github.event.workflow_run.head_sha }}"
